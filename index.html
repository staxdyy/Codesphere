<html lang="tr">

<style>

:root[data-theme="dark"]{color-scheme:dark;--bg:#0d1117;--panel:#161b22;--bar:#010409;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--a:#238636;--b:#58a6ff;--code:#0d1117;--bad:#f85149}

:focus-visible{outline:2px solid var(--b);outline-offset:2px}

.card b{display:block;font-size:16px}

.form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px;margin-top:12px}

.ed{display:flex;flex-direction:column;gap:8px;min-width:0}

button[aria-current=true]{border-color:var(--b);font-weight:700}.md h2,.md h3,.md h4{margin:14px 0 6px}.md p,.md ul{margin:6px 0}.md pre{background:var(--bar);border-radius:8px;padding:10px;overflow:auto;font-family:"JetBrains Mono",monospace;font-size:13px}.md code{background:var(--bar);padding:1px 5px;border-radius:5px;font-family:"JetBrains Mono",monospace;font-size:13px}
.av,.lg,.mini,.avb{overflow:hidden}.pimg{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}.big{width:72px;height:72px;font-size:36px}.pp{display:grid;gap:8px}.pick img{width:100%;aspect-ratio:1;border-radius:50%;display:block}.pick button{padding:2px}

.empty{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted);font-size:14px}
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.rcard h3{margin:0 0 12px;font-size:14px}.rcard ul{list-style:none;margin:0 0 10px;padding:0 0 0 16px;border-left:2px solid var(--line)}.rcard li{margin:0 0 14px;font-size:14px;position:relative}.rcard li::before{content:"";position:absolute;left:-21px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.avb{width:34px;height:34px;padding:0;border-radius:50%;font-size:18px}#hs{width:min(260px,40vw);padding:7px 10px;border-radius:8px}
.plusw{position:relative}.pm{position:absolute;right:0;top:40px;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;min-width:190px;box-shadow:0 8px 24px rgba(0,0,0,.25)}.pm[hidden]{display:none}.pm button{border:0;background:none;text-align:left}
main.wide{max-width:1360px;padding:0}.logo{margin-right:auto}
@media (max-width:1000px){.shell{grid-template-columns:230px minmax(0,1fr)}.rt{grid-column:1/-1;padding:0 24px 40px}}

.conv{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.conv textarea.code{height:420px}@media (max-width:700px){.conv{grid-template-columns:1fr}.conv textarea.code{height:260px}}
#lang{font-size:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 8px;max-width:130px}
#note{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--a);color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;display:none;z-index:20}
@media (max-width:700px){.ide{grid-template-columns:1fr}}
</style>
</head>

}
function paintMe(){var b=document.getElementById("nMe");b.replaceChildren(faceNode(logos[myId],(names[myId]||"?").charAt(0).toUpperCase()))}

  }

  var starsHead=h("div",{class:"sec"},h("h2",0,"Yıldızladıklarım"));
  async function loadStars(){

      var d=(await db.doc("profiles/"+myId).get()).data()||{},ks=(d.starred||[]).slice(-6).reverse(),out=[];
      for(var i=0;i<ks.length;i++){var a=ks[i].split("/"),u=a[0],pid=a[1];
        if(FAKE[u]&&FAKE[u].repos[pid])out.push({u:u,pid:pid,d:FAKE[u].repos[pid],st:FAKE[u].repos});
        else{var s=await db.doc(projPath(u,false)+"/"+pid).get();if(s.exists){var o={};o[pid]=s.data();out.push({u:u,pid:pid,d:s.data(),st:o})}}}
      await loadNames(out.map(function(x){return x.u}));

      starBox.replaceChildren(out.length?h("div",{class:"grid"},out.map(function(x){return h("button",{class:"card",on:{click:function(){repo(x.u,x.pid,false,x.st)}}},h("b",0,(names[x.u]||"")+"/"+x.d.name),h("span",{class:"muted"},x.d.desc||"Açıklama yok"))})):h("div",{class:"empty"},"Henüz yıldızladığın proje yok. Keşfet’ten bir projeye ☆ ver."));
    }catch(e){starBox.replaceChildren(h("div",{class:"empty"},"Yıldızlar yüklenemedi."))}

  var news=h("div",{class:"rcard"},h("h3",0,"Codesphere’de yenilikler"),h("ul",0,
    h("li",0,"Kod dönüştürücü: 36 dil arasında çeviri"),h("li",0,"Kayıtta logo seçimi, üst menüde ve profilinde görünür"),h("li",0,"Commit geçmişi, yıldız ve fork"),h("li",0,"Keşfet’te örnek kullanıcılar")),
    h("button",{style:"margin-top:4px",on:{click:function(){explore()}}},"Keşfet’e git →"));
  var chips=h("div",{class:"chips"},
    h("button",{on:{click:converter}},"⇄ Kod dönüştür"),h("button",{on:{click:function(){profile(myId)}}},"＋ Yeni proje"),h("button",{on:{click:function(){explore()}}},"◎ Keşfet"),h("button",{on:{click:function(){document.getElementById("nTheme").click()}}},"◐ Tema"));
  mount(h("div",{class:"shell"},side,

      h("div",{class:"ask"},ta,h("div",{class:"row",style:"justify-content:flex-end"},h("span",{class:"muted"},"Ctrl+Enter ile gönder"),sb)),ans,chips,
      h("div",{class:"sec"},h("h2",0,"Son projelerim"),h("button",{on:{click:function(){profile(myId)}}},"Tümünü gör")),recent,starsHead,starBox),
    h("aside",{class:"rt"},news)));
  app.classList.add("wide");
  sub(projPath(myId,false),pub);sub(projPath(myId,true),prv);draw();loadStars();

/* ---------- Kod dönüştürücü ---------- */
var LANGS=["Python","JavaScript","TypeScript","Java","C#","C++","C","Go","Rust","PHP","Ruby","Swift","Kotlin","Dart","Lua","SQL","HTML","CSS","JSON","YAML","Bash","Scala","Haskell","R","MATLAB","Perl","Elixir","Clojure","Objective-C","Visual Basic","F#","Julia","Groovy","PowerShell","Fortran","Pascal"];
var EXT={Python:"py",JavaScript:"js",TypeScript:"ts",Java:"java","C#":"cs","C++":"cpp",C:"c",Go:"go",Rust:"rs",PHP:"php",Ruby:"rb",Swift:"swift",Kotlin:"kt",Dart:"dart",Lua:"lua",SQL:"sql",HTML:"html",CSS:"css",JSON:"json",YAML:"yml",Bash:"sh",Scala:"scala",Haskell:"hs",R:"r",MATLAB:"m",Perl:"pl",Elixir:"ex",Clojure:"clj","Objective-C":"m","Visual Basic":"vb","F#":"fs",Julia:"jl",Groovy:"groovy",PowerShell:"ps1",Fortran:"f90",Pascal:"pas"};
function unfence(t){return String(t||"").replace(/^\s*```[A-Za-z+#]*\n?/,"").replace(/\n?```\s*$/,"")}
function converter(){
  var opts=function(){return LANGS.map(function(l){return h("option",{value:l},l)})};
  var src=h("select",{"aria-label":"Kaynak dil"},h("option",{value:""},"Otomatik algıla"),opts()),dst=h("select",{"aria-label":"Hedef dil"},opts());
  dst.value="Python";
  var inp=h("textarea",{class:"code",spellcheck:"false",placeholder:"Dönüştürmek istediğin kodu buraya yapıştır…","aria-label":"Kaynak kod"}),
      out=h("textarea",{class:"code",spellcheck:"false",readonly:"",placeholder:"Dönüşen kod burada görünecek.","aria-label":"Dönüşen kod"}),
      st=h("span",{class:"muted"}),btn=h("button",{class:"pri"},"Dönüştür");
  async function go(){
    var code=inp.value.trim();if(!code){say("Önce kod yaz");return}
    if(src.value===dst.value){say("Kaynak ve hedef dil aynı");return}
    var sample=null;try{sample=await claude.use("sample")}catch(e){}
    if(!sample){say("Yapay zekâ bağlantısı bu görünümde yok");return}
    btn.disabled=true;st.textContent="Dönüştürülüyor…";out.value="";
    var from=src.value?src.value+" dilinden":"(dilini kendin algıla) dilinden";
    try{
      var r=await sample("Aşağıdaki kodu "+from+" "+dst.value+" diline dönüştür. Aynı işi yapsın, hedef dilin kurallarına ve yaygın adlandırmasına uy. SADECE dönüştürülmüş kodu yaz: açıklama, başlık veya ``` işareti ekleme. Dönüştürülemeyen bir kısım varsa onu kodun içinde kısa bir yorum satırıyla belirt.\n\nKOD:\n"+code,{cache:false,onText:function(x){out.value=unfence(x.text)}});
      out.value=unfence(r.text);st.textContent=r.truncated?"Çıktı uzun olduğu için kesilmiş olabilir.":"Bitti.";
    }catch(e){out.value=out.value||"";st.textContent=e&&e.code==="rate_limited"?"Çok sık denedin, biraz bekle.":e&&e.code==="not_granted"?"İzin verilmedi.":"Dönüştürülemedi, tekrar dene."}
    finally{btn.disabled=false}
  }
  btn.onclick=go;
  var tools=h("div",{class:"row"},src,h("button",{"aria-label":"Dilleri değiştir",on:{click:function(){if(!src.value){say("Önce kaynak dili seç");return}var t=src.value;src.value=dst.value;dst.value=t;var o=out.value;if(o){inp.value=o;out.value=""}}}},"⇄"),dst,btn,st);
  var acts=h("div",{class:"row"},
    h("button",{on:{click:async function(){if(!out.value)return;try{await navigator.clipboard.writeText(out.value);say("Kopyalandı")}catch(e){out.removeAttribute("readonly");out.select();var ok=false;try{ok=document.execCommand("copy")}catch(x){}out.setAttribute("readonly","");say(ok?"Kopyalandı":"Kopyalanamadı, elle seç")}}}},"Kopyala"),
    h("button",{on:{click:async function(){if(!out.value)return;try{var dl=await claude.use("downloads");if(!dl){say("İndirme bu görünümde yok");return}await dl.save({filename:"donusen."+(EXT[dst.value]||"txt"),data:out.value})}catch(e){say("İndirilemedi")}}}},"İndir"),
    h("button",{on:{click:function(){inp.value="";out.value="";st.textContent=""}}},"Temizle"));
  mount(h("h1",0,"Kod dönüştürücü"),h("p",{class:"muted"},"Kodunu bir programlama dilinden başka bir dile çevirir. Sonucu çalıştırmadan önce mutlaka oku ve dene; yapay zekâ hata yapabilir."),
    tools,h("div",{class:"conv"},inp,out),acts);
}

/* ---------- Giriş ekranı ---------- */
function hex(u){return Array.prototype.map.call(u,function(x){return("0"+x.toString(16)).slice(-2)}).join("")}
async function hashPw(pw,salt){var k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);var b=await crypto.subtle.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode(salt),iterations:150000,hash:"SHA-256"},k,256);return hex(new Uint8Array(b))}
async function gate(){
  var aRef=db.doc("data/users/"+myId+"/auth"),a=await aRef.get(),ad=a.exists?a.data():null,ok=false;
  try{ok=sessionStorage.getItem("cs:ok")===myId}catch(e){}
  if(ad&&ok){names[myId]=ad.username;return}
  locked=true;
  await new Promise(function(done){
    var reg=!ad,btn,
      u=h("input",{type:"text",placeholder:"kullanıcı adı",autocomplete:"username"}),
      p=h("input",{type:"password",placeholder:"şifre",autocomplete:reg?"new-password":"current-password"}),
      p2=h("input",{type:"password",placeholder:"şifre (tekrar)",autocomplete:"new-password"}),
      err=h("p",{class:"muted",style:"color:var(--bad);margin:0",role:"alert"});
    async function go(){
      err.textContent="";btn.disabled=true;
      try{
        var name=u.value.trim().toLowerCase(),pw=p.value;
        if(reg){
          if(!/^[a-z0-9_]{3,20}$/.test(name)){err.textContent="Kullanıcı adı 3-20 karakter olmalı; harf, rakam ve _ kullanabilirsin.";return}
          if(pw.length<6){err.textContent="Şifre en az 6 karakter olmalı.";return}
          if(pw!==p2.value){err.textContent="Şifreler aynı değil.";return}
          var taken=await db.doc("usernames/"+name).get();
          if(taken.exists&&(taken.data()||{}).uid!==myId){err.textContent="Bu kullanıcı adı alınmış.";return}
          var salt=hex(crypto.getRandomValues(new Uint8Array(16))),hash=await hashPw(pw,salt);
          var old=await db.doc("profiles/"+myId).get(),od=old.exists?old.data():{};
          if(ad&&ad.username!==name){try{await db.doc("usernames/"+ad.username).delete()}catch(e){}}
          await db.doc("usernames/"+name).set({uid:myId});
          await aRef.set({username:name,salt:salt,hash:hash});
          await db.doc("profiles/"+myId).set({bio:bioIn.value.trim()||od.bio||"",count:od.count||0,username:name,logo:pp.get(),starred:od.starred||[],loc:od.loc||""});
          logos[myId]=pp.get();setLogo(pp.get());paintMe();
          names[myId]=name;
        }else{
          if(!ad){err.textContent="Bu hesapta kayıt yok. Önce “Kayıt ol” sekmesini kullan.";return}
          if(name!==ad.username||(await hashPw(pw,ad.salt))!==ad.hash){await new Promise(function(r){setTimeout(r,1500)});err.textContent="Kullanıcı adı veya şifre yanlış.";return}
          names[myId]=ad.username;
        }
        try{sessionStorage.setItem("cs:ok",myId)}catch(e){}
        locked=false;done();
      }catch(e){err.textContent="Bir hata oldu, tekrar dene."}
      finally{btn.disabled=false}
    }
    btn=h("button",{class:"pri",on:{click:go}},"");
    [u,p,p2].forEach(function(i){i.addEventListener("keydown",function(e){if(e.key==="Enter")go()})});
    var pp=photoPicker("p:0"),bioIn=h("textarea",{class:"f",rows:"2",placeholder:"Kendini kısaca anlat (isteğe bağlı)","aria-label":"Tanıtım"});
    var pick=h("div",0,h("div",{class:"muted"},"Profil fotoğrafı"),pp.node,h("div",{class:"muted",style:"margin-top:8px"},"Tanıtım"),bioIn);
    function render(){
      err.textContent="";
      p.setAttribute("autocomplete",reg?"new-password":"current-password");
      btn.textContent=reg?"Hesap oluştur":"Giriş yap";
      var blocked=false;
      mount(h("div",{style:"max-width:380px;margin:40px auto"},
        h("h1",0,"Codesphere"),
        h("div",{class:"row",style:"margin:12px 0"},
          h("button",{"aria-current":!reg,on:{click:function(){reg=false;render()}}},"Giriş yap"),
          h("button",{"aria-current":reg,on:{click:function(){reg=true;render()}}},"Kayıt ol")),
        blocked?h("p",{class:"muted"},reg?"Bu hesapta zaten bir kayıt var. “Giriş yap” sekmesini kullan.":"Henüz kayıt yok. Önce “Kayıt ol” sekmesinden hesap oluştur.")
        :h("div",0,h("p",{class:"muted"},reg?(ad?"Bu hesapta “"+ad.username+"” kullanıcısı var. Yeni kayıt, kullanıcı adını ve şifreni değiştirir; projelerin korunur. ":"")+"Codesphere için bir kullanıcı adı ve şifre seç. Başka yerlerde kullandığın şifreyi yazma.":(ad?"":"Henüz kayıt yok, önce Kayıt ol sekmesini kullan. ")+"Kullanıcı adın ve şifrenle giriş yap."),
          h("div",{class:"form"},u,p,reg?p2:null,reg?pick:null,err,btn))));
    }
    render();
  });
}
document.getElementById("nOut").onclick=async function(){try{sessionStorage.removeItem("cs:ok")}catch(e){}await gate();await afterGate();dashboard()};

var pm=document.getElementById("pm");
document.getElementById("plus").onclick=function(e){e.stopPropagation();pm.hidden=!pm.hidden};
document.addEventListener("click",function(){pm.hidden=true});
document.addEventListener("keydown",function(e){if(e.key==="Escape")pm.hidden=true;if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||"")){e.preventDefault();document.getElementById("hs").focus()}});
document.getElementById("pnew").onclick=function(){if(!locked)profile(myId)};
document.getElementById("hs").addEventListener("keydown",function(e){if(e.key==="Enter"&&!locked)explore(this.value.trim())});
document.getElementById("hamb").onclick=function(){if(locked)return;if(!document.querySelector(".sb")){dashboard();return}document.body.classList.toggle(window.innerWidth<=700?"sbopen":"nosb")};
document.getElementById("nMe").onclick=function(){if(myId&&!locked)profile(myId)};

initLang();
async function afterGate(){try{var d=(await db.doc("profiles/"+myId).get()).data()||{};logos[myId]=d.logo||"";if(d.logo)setLogo(d.logo)}catch(e){}paintMe()}
await gate();
await afterGate();
dashboard();
})();
